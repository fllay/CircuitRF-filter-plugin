name: beta-release

# Push a tag such as v0.2.0-beta.1 to build every platform and publish a GitHub pre-release.
# "Run workflow" (workflow_dispatch) builds and uploads the zips as workflow artifacts only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "9.0.x" }
      - run: dotnet test tests/FiltSyn.Core.Tests -c Release

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: osx-arm64,   os: macos-14,       exe: filtsyn-plugin }
          - { rid: osx-x64,     os: macos-14,       exe: filtsyn-plugin }
          - { rid: linux-x64,   os: ubuntu-latest,  exe: filtsyn-plugin }
          - { rid: linux-arm64, os: ubuntu-latest,  exe: filtsyn-plugin }
          - { rid: win-x64,     os: windows-latest, exe: filtsyn-plugin.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "9.0.x" }
      - name: Publish single-file, self-contained
        shell: bash
        run: >
          dotnet publish src/FiltSyn.Plugin -c Release -r ${{ matrix.rid }} --self-contained true
          -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true -o out/${{ matrix.rid }}
      - name: Ad hoc sign (macOS)
        if: startsWith(matrix.rid, 'osx-')
        run: codesign --force --sign - out/${{ matrix.rid }}/${{ matrix.exe }}
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          python3 tools/package-plugin.py dist/filtsyn-plugin-${{ matrix.rid }}.zip ${{ matrix.rid }}=out/${{ matrix.rid }}/${{ matrix.exe }}
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.rid }}
          path: |
            dist/*.zip
            out/${{ matrix.rid }}/${{ matrix.exe }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: All-platform zip
        run: |
          mkdir -p dist
          cp artifacts/*/dist/*.zip dist/
          chmod +x artifacts/*/out/*/filtsyn-plugin*
          python3 tools/package-plugin.py dist/filtsyn-plugin-all.zip \
            osx-arm64=artifacts/plugin-osx-arm64/out/osx-arm64/filtsyn-plugin \
            osx-x64=artifacts/plugin-osx-x64/out/osx-x64/filtsyn-plugin \
            linux-x64=artifacts/plugin-linux-x64/out/linux-x64/filtsyn-plugin \
            linux-arm64=artifacts/plugin-linux-arm64/out/linux-arm64/filtsyn-plugin \
            win-x64=artifacts/plugin-win-x64/out/win-x64/filtsyn-plugin.exe
          ls -la dist
      - name: Publish pre-release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.zip --prerelease --generate-notes \
            --title "${GITHUB_REF_NAME} (beta)" \
            --notes "Beta build of the FiltSyn CircuitRF plugin. Unzip a platform zip and add the filtsyn-plugin folder in CircuitRF (Tools > Plugins). macOS binaries are ad hoc signed, not notarised: if Gatekeeper blocks it, run xattr -dr com.apple.quarantine on the folder."
